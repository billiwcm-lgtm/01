name: Pipeline Geração e Edição de Vídeo com Pastas

on:
  workflow_dispatch:

jobs:
  construir-video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependências do Python
      run: pip install requests

    - name: Instalar FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Executar Automação de Mídias
      env:
        VIBES_COOKIES: ${{ secrets.VIBES_COOKIES }}
      run: python gerar_e_editar.py

    # Faz o upload de toda a pasta de vídeos finais salvos pelo script
    - name: Upload da Pasta de Vídeos Prontos
      uses: actions/upload-artifact@v4
      with:
        name: producao-videos-finais
        path: videos_finais/
