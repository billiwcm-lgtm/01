name: Pipeline IA - Motor de Mídia e Envio ao Google Drive

on:
  repository_dispatch:
    types: [disparar_geracao_ia]
  workflow_dispatch:
    inputs:
      texto_teste:
        description: 'Texto para teste manual'
        required: false
        default: 'Teste de envio automático direto para o Google Drive.'

jobs:
  processar-e-enviar:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Baixando Código do Repositório
      uses: actions/checkout@v4

    - name: 2. Configurando Ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Instalar Dependências do Python
      run: pip install -r requirements.txt

    - name: 4. Instalar FFmpeg e Rclone (Para o Google Drive)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg rclone

    - name: 5. Configurar Credenciais do Rclone
      run: |
        mkdir -p ~/.config/rclone
        echo "${{ secrets.RCLONE_CONFIG_DATA }}" > ~/.config/rclone/rclone.conf

    - name: 6. Executar Automação de Vídeo e Áudio
      env:
        VIBES_COOKIES: ${{ secrets.VIBES_COOKIES }}
        DADOS_NOTION_JSON: ${{ github.event.client_payload && jsonEncode(github.event.client_payload) || format('{{\"texto_audio\":\"{0}\"}}', github.event.inputs.texto_teste) }}
      run: python gerar_e_editar.py

    - name: 7. Upload do Vídeo Diretamente para o Google Drive
      run: |
        # Envia todo o conteúdo da pasta 'videos_finais' para a pasta remota configurada no Google Drive
        rclone copy videos_finais/ gdrive:videos_gerados_ia -P
